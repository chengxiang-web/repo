<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>死刑犯憲法訴訟聲請與執行狀態即時分析儀表板</title>
    <!-- 引入 PapaParse 用來完美解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --container-bg: #1a1a1a;
            --text-main: #ffffff;         /* 提升至純白，更亮 */
            --text-muted: #b0b0b0;        /* 提升次要文字亮度 */
            --border-color: #404040;      /* 加強邊框對比 */
            --accent-blue: #4a90e2;       /* 更明亮的藍色 */
            --header-bg: #262626;
            --row-hover: #2f2f2f;
            --danger-text: #ff6b6b;
            --success-text: #51cf66;
            --badge-executed-bg: rgba(255, 107, 107, 0.2);
            --badge-executed-color: #ff6b6b;
            --badge-unexecuted-bg: rgba(81, 207, 102, 0.2);
            --badge-unexecuted-color: #51cf66;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            font-weight: 400;             /* 微調字重讓標題更顯眼 */
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #ffffff;
        }
        h2 {
            font-size: 1.25rem;
            color: var(--accent-blue);
            text-align: left;
            border-left: 4px solid var(--accent-blue);
            padding-left: 12px;
            margin-top: 40px;
            margin-bottom: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: var(--container-bg);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--container-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }
        th {
            background-color: var(--header-bg);
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 1rem;
            white-space: nowrap;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: var(--row-hover);
        }
        .highlight {
            color: #ffffff;
            font-weight: 600;
        }
        .badge-executed {
            background-color: var(--badge-executed-bg);
            color: var(--badge-executed-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .badge-unexecuted {
            background-color: var(--badge-unexecuted-bg);
            color: var(--badge-unexecuted-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .note {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 30px;
        }
        #loading {
            text-align: center;
            font-size: 1.3rem;
            color: var(--accent-blue);
            margin: 50px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>死刑犯憲法訴訟聲請與執行狀態即時分析儀表板</h1>

    <div id="loading">⏳ 正在讀取並分析 CSV 資料，請稍候...</div>

    <div id="content" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>總紀錄筆數</h3>
                <div class="number" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>涉及死囚/聲請人</h3>
                <div class="number" id="stat-people">0 位</div>
            </div>
            <div class="stat-card">
                <h3>已執行（已伏法）人數</h3>
                <div class="number" id="stat-executed">0 位</div>
            </div>
            <div class="stat-card">
                <h3>未執行人數</h3>
                <div class="number" id="stat-unexecuted">0 位</div>
            </div>
        </div>

        <h2>一、 最終結果／類別分類統計</h2>
        <table>
            <thead>
                <tr>
                    <th>類別結果</th>
                    <th>案件數量</th>
                    <th>佔比</th>
                </tr>
            </thead>
            <tbody id="category-table-body">
                <!-- 動態填入 -->
            </tbody>
        </table>

        <h2>二、 依年份（2008-2026）案件數量統計</h2>
        <table>
            <thead>
                <tr>
                    <th width="30%">年份</th>
                    <th width="40%">案件數量</th>
                    <th width="30%">佔比</th>
                </tr>
            </thead>
            <tbody id="year-table-body">
                <!-- 動態填入 -->
            </tbody>
        </table>

        <h2>三、 各死囚聲請次數與執行狀態統計排名</h2>
        <table>
            <thead>
                <tr>
                    <th width="10%">排名</th>
                    <th width="35%">死囚姓名</th>
                    <th width="25%">執行狀態</th>
                    <th width="30%">聲請次數</th>
                </tr>
            </thead>
            <tbody id="inmate-table-body">
                <!-- 動態填入 -->
            </tbody>
        </table>
    </div>

    <div class="note">
        資料來源：即時讀取同目錄下 death_row_appeals_ultimate.csv 檔案進行前端運算。
    </div>
</div>

<script>
    // 已執行名單（36人）
    const executedInmates = {
        "黃麟凱": "2024年", "翁仁賢": "2020年", "李宏基": "2018年", "鄭捷": "2016年", 
        "張俊宏": "2014年", "洪晨耀": "2012年", "柯世銘": "2012年", "張文蔚": "2011年", 
        "管鐘演": "2011年", "鍾德樹": "2011年", "王志煌": "2013年", "莊天祝": "2012年", 
        "王國華": "2010年", "曾思儒": "2012年", "洪明聰": "2012年", "黃賢正": "2012年", 
        "陳金火": "2012年", "廣德強": "2012年", "戴德穎": "2010年", "陳瑞欽": "2013年", 
        "陳東榮": "2012年", "紀俊毅": "2012年", "李嘉軒": "2012年", "林金德": "2012年", 
        "張胞輝": "2010年", "杜明郎": "2010年", "杜明雄": "2010年", "劉炎國": "2014年", 
        "鄧堅": "2010年", "戴文慶": "2010年", "王秀昉": "2010年", "鄭金文": "2012年", 
        "曹添壽": "2012年", "黃主旺": "2015年", "王俊欽": "2012年", "王裕隆": "2012年"
    };

    // 加上時間戳記強制繞過瀏覽器快取
    const csvUrl = 'death_row_appeals_ultimate.csv?t=' + Date.now();

    Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            const data = results.data;
            processData(data);
        },
        error: function(err) {
            document.getElementById('loading').innerHTML = '❌ 讀取 CSV 失敗，請確認該檔案與 HTML 是否在同一個資料夾，且已透過區域伺服器（Live Server）開啟。';
            console.error(err);
        }
    });

    function processData(data) {
        const totalRecords = data.length;

        const categoryCounts = {};
        const inmateCounts = {};
        const yearCounts = {};

        // 初始化 2008 到 2026 年的統計（預設為 0）
        for (let y = 2008; y <= 2026; y++) {
            yearCounts[y] = 0;
        }

        data.forEach(row => {
            const name = row['死囚姓名'] ? row['死囚姓名'].trim() : '未知';
            const category = row['類別'] ? row['類別'].trim() : '未分類';
            const dateStr = row['裁定時間'] ? row['裁定時間'].trim() : '';

            // 計算死囚次數
            inmateCounts[name] = (inmateCounts[name] || 0) + 1;

            // 計算類別次數
            categoryCounts[category] = (categoryCounts[category] || 0) + 1;

            // 解析年份 (支援民國轉西元或直接抓取西元年)
            let year = null;
            // 嘗試抓取民國年份 (例如: 113年 或 99年)
            const rocMatch = dateStr.match(/(\d+)\s*年/);
            if (rocMatch) {
                const rocYear = parseInt(rocMatch[1]);
                // 如果年份小於 200，視為民國年轉西元年
                if (rocYear < 200) {
                    year = rocYear + 1911;
                } else {
                    year = rocYear; // 已經是西元年
                }
            } else {
                // 嘗試直接抓取 4 位數西元年
                const adMatch = dateStr.match(/(20\d{2}|19\d{2})/);
                if (adMatch) {
                    year = parseInt(adMatch[1]);
                }
            }

            if (year && year >= 2008 && year <= 2026) {
                yearCounts[year] = (yearCounts[year] || 0) + 1;
            }
        });

        const uniquePeopleCount = Object.keys(inmateCounts).length;

        // 轉換死囚統計並排序
        const sortedInmates = Object.entries(inmateCounts).map(([name, count]) => {
            const isExecuted = executedInmates.has(name);
            return { name, count, isExecuted };
        }).sort((a, b) => b.count - a.count);

        let executedCount = 0;
        let unexecutedCount = 0;
        sortedInmates.forEach(item => {
            if (item.isExecuted) executedCount++;
            else unexecutedCount++;
        });

        // 渲染頂部數據卡片
        document.getElementById('stat-total').innerText = totalRecords;
        document.getElementById('stat-people').innerText = uniquePeopleCount + ' 位';
        document.getElementById('stat-executed').innerText = executedCount + ' 位';
        document.getElementById('stat-unexecuted').innerText = unexecutedCount + ' 位';

        // 渲染類別統計表格
        const catTableBody = document.getElementById('category-table-body');
        catTableBody.innerHTML = '';
        Object.entries(categoryCounts).forEach(([cat, count]) => {
            const pct = ((count / totalRecords) * 100).toFixed(1);
            catTableBody.innerHTML += `
                <tr>
                    <td class="highlight">${cat}</td>
                    <td>${count} 筆</td>
                    <td>${pct}%</td>
                </tr>
            `;
        });

        // 渲染年份統計表格 (2008-2026)
        const yearTableBody = document.getElementById('year-table-body');
        yearTableBody.innerHTML = '';
        for (let y = 2008; y <= 2026; y++) {
            const count = yearCounts[y] || 0;
            const pct = totalRecords > 0 ? ((count / totalRecords) * 100).toFixed(1) : '0.0';
            yearTableBody.innerHTML += `
                <tr>
                    <td class="highlight">${y} 年</td>
                    <td>${count} 筆</td>
                    <td>${pct}%</td>
                </tr>
            `;
        }

        // 渲染死囚聲請排名表格
        const inmateTableBody = document.getElementById('inmate-table-body');
        inmateTableBody.innerHTML = '';
        sortedInmates.forEach((item, index) => {
            const badgeClass = item.isExecuted ? 'badge-executed' : 'badge-unexecuted';
            const badgeText = item.isExecuted ? '已執行（已伏法）' : '未執行';
            inmateTableBody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td class="highlight">${item.name}</td>
                    <td><span class="${badgeClass}">${badgeText}</span></td>
                    <td>${item.count} 次</td>
                </tr>
            `;
        });

        // 隱藏讀取動畫，顯示內容
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    }
</script>
</body>
</html>
